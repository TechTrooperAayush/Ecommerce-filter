<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyBasket</title>
    <link rel="stylesheet" href="../src/style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <main class="main-container">
        <div class="addcartbar">
            <h1>EasyBasket</h1>
            <button class="addcart-btn"><i class="ri-shopping-bag-3-line"></i></button>
            <span class="cart-value"></span>
        </div>
        <div class="filter-section">
            <button class="all-btn btn">All</button>
            <button class="man-btn btn">Man</button>
            <button class="women-btn btn">Woman</button>
            <button class="tech-btn btn">Tech</button>
            <button class="jewellary-btn btn">jewellary</button>
        </div>
        <div class="products">
        </div>
    </main>
    <script src="./script.js" type="module"></script>
</body>
</html>
